<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瓦友社 · 任务池（加密预览）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0a0e13;color:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{display:grid;place-items:center;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(ellipse at 20% 18%,rgba(20,118,110,.30),transparent 36%),radial-gradient(ellipse at 80% 85%,rgba(20,184,166,.12),transparent 34%),linear-gradient(135deg,#0a0e13,#0f1923 56%,#07090d)}
body::after{content:"";position:fixed;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(ellipse at center,#000,transparent 78%)}
.card{position:relative;z-index:1;width:min(92vw,520px);padding:34px 32px 30px;background:rgba(15,25,35,.78);border:1px solid rgba(20,184,166,.46);box-shadow:0 28px 100px rgba(0,0,0,.56),0 0 80px rgba(20,184,166,.12),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(22px);clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.kicker{font-size:12px;letter-spacing:3px;color:#5eead4;font-weight:900;margin-bottom:14px}
h1{font-size:clamp(30px,6.5vw,52px);line-height:.98;letter-spacing:-.05em;margin-bottom:14px;background:linear-gradient(135deg,#fff,#a7f3e6 44%,#14b8a6);-webkit-background-clip:text;color:transparent}
p{color:rgba(232,237,242,.68);line-height:1.8;font-size:14px;margin-bottom:24px}
.form{display:flex;gap:10px;align-items:stretch}
input{flex:1;min-width:0;height:48px;background:rgba(2,7,12,.72);border:1px solid rgba(255,255,255,.12);color:#fff;padding:0 14px;outline:none;font-size:15px}
input:focus{border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.18)}
button{height:48px;padding:0 18px;border:0;background:#0f766e;color:#fff;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 12px 30px rgba(20,184,166,.26)}
button:disabled{opacity:.55;cursor:not-allowed}
.err{min-height:20px;margin-top:14px;color:#fca5a5;font-size:13px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.meta span{font-size:11px;letter-spacing:1.5px;color:#5eead4;border:1px solid rgba(20,184,166,.22);background:rgba(20,184,166,.07);padding:7px 9px;border-radius:999px;font-weight:800}
</style>
</head>
<body>
<main class="card">
  <div class="kicker">WAYOUSHE · TASK POOL</div>

    <input id="pwd" type="password" autocomplete="current-password" placeholder="输入访问口令" autofocus>
    <button id="btn" type="submit">解锁</button>
  </form>
  <div class="err" id="err"></div>

const ITERATIONS = 200000;
const enc = new TextEncoder();
const dec = new TextDecoder();
function bytesFromBase64(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function decrypt(password){
  const raw=bytesFromBase64(PAYLOAD);const salt=raw.slice(0,16);const iv=raw.slice(16,28);const data=raw.slice(28);
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITERATIONS,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
  return dec.decode(plain);
}
async function unlock(password){
  const html=await decrypt(password);sessionStorage.setItem('wayoushe_task_pool_pwd',password);document.open();document.write(html);document.close();
}
