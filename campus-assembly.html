<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6ff3d" />
  <title>返校集结｜瓦友社</title>
  <style>
    :root {
      --acid: #cbd96a;
      --acid-deep: #adb951;
      --red: #cbd96a;
      --red-deep: #adb951;
      --mint: #dfe4da;
      --cyan: #c5cbc2;
      --violet: #7a8279;
      --ink: #1b1e1c;
      --ink-soft: #2b302d;
      --paper: #eef0ec;
      --line: rgba(27, 30, 28, .14);
      --shadow: 0 18px 46px rgba(27, 30, 28, .12);
      --display: "PingFang SC", "Microsoft YaHei", "Arial Black", sans-serif;
      --body: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
    a { color: inherit; }

    .page { overflow: hidden; min-height: 100vh; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 8px; height: 8px; background: currentColor; transform: rotate(45deg); }
    .section-header { display: flex; justify-content: space-between; gap: 30px; align-items: end; margin: 0 0 18px; }
    .section-title { margin: 6px 0 0; font: 900 clamp(30px, 4vw, 52px)/.92 var(--display); letter-spacing: -.055em; text-transform: uppercase; }
    .section-copy { max-width: 310px; margin: 0 0 3px; color: #56534b; font-size: 13px; line-height: 1.7; }

    .topbar { height: 50px; background: var(--ink); color: #fff; border-bottom: 4px solid var(--red); }
    .topbar-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 13px; font-weight: 900; }
    .brand-mark { display: grid; width: 22px; height: 22px; place-items: center; color: var(--ink); background: var(--acid); font-size: 12px; transform: rotate(-5deg); }
    .top-nav { display: flex; align-items: center; gap: 17px; color: #d8d8d8; font-size: 11px; font-weight: 700; }
    .top-nav span:first-child { color: var(--acid); }

    .campaign-strip { position: relative; isolation: isolate; height: 155px; background: var(--acid); overflow: hidden; border-bottom: 1px solid var(--ink); }
    .campaign-strip::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(115deg, transparent 0 18%, rgba(255,255,255,.6) 18.1% 32%, transparent 32.1% 52%, rgba(153,242,213,.85) 52.1% 65%, transparent 65.1%), repeating-linear-gradient(115deg, transparent 0 56px, rgba(242,56,35,.93) 57px 75px, transparent 76px 121px); opacity: .84; }
    .campaign-strip::after { content: "返校集结"; position: absolute; z-index: -1; right: -12px; bottom: -30px; font: 900 clamp(85px, 15vw, 205px)/.8 var(--display); letter-spacing: -.08em; color: rgba(255,255,255,.7); white-space: nowrap; }
    .strip-inner { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    .strip-super { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 10px; font-weight: 900; letter-spacing: .22em; }
    .strip-title { margin: 7px 0 3px; font: 900 clamp(38px, 6vw, 76px)/.79 var(--display); letter-spacing: -.065em; text-transform: uppercase; transform: skewX(-4deg); }
    .strip-note { width: fit-content; padding: 4px 8px; color: #fff; background: var(--ink); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .strip-sticker { position: absolute; right: 0; top: 24px; display: grid; width: 98px; height: 98px; place-items: center; text-align: center; background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 50%; box-shadow: 5px 5px 0 var(--ink); font: 900 16px/.9 var(--display); letter-spacing: -.02em; transform: rotate(10deg); }
    .strip-sticker small { display: block; margin-top: 3px; font: 900 8px var(--body); letter-spacing: .1em; }

    .mission-zone { position: relative; padding: 42px 0 48px; }
    .mission-zone::before { content: "01"; position: absolute; z-index: -1; top: 18px; left: max(18px, calc((100vw - 1180px) / 2 - 55px)); color: rgba(93,67,207,.11); font: 900 160px/.8 var(--display); }
    .mission-board { position: relative; box-shadow: var(--shadow); border: 1px solid var(--ink); background: #fffdf5; }
    .board-banner { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 22px; min-height: 116px; padding: 22px 26px; color: #fff; background: var(--ink); overflow: hidden; }
    .board-banner::before { content: "MISSION"; position: absolute; right: 20px; top: -13px; color: rgba(244,255,50,.12); font: 900 108px/.8 var(--display); letter-spacing: -.07em; }
    .board-banner .eyebrow { color: var(--acid); }
    .board-banner h2 { position: relative; margin: 8px 0 0; font: 900 clamp(27px, 4vw, 46px)/.9 var(--display); letter-spacing: -.045em; }
    .board-meta { position: relative; display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 700; }
    .board-meta strong { color: var(--acid); font-size: 18px; }
    .mission-content { padding: 22px; }
    .progress-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding-bottom: 16px; }
    .progress-row span { color: #6a675f; font-size: 12px; font-weight: 800; }
    .progress-line { position: relative; flex: 1; height: 9px; max-width: 300px; background: #e7e3d6; overflow: hidden; }
    .progress-line::before { content: ""; display: block; width: 33.33%; height: 100%; background: var(--violet); }
    .mission-grid { display: grid; grid-template-columns: 1.07fr .965fr .965fr; gap: 12px; }
    .mission-card { position: relative; min-height: 248px; display: flex; flex-direction: column; padding: 19px; overflow: hidden; border: 1px solid var(--ink); background: #fff; }
    .mission-card::after { content: attr(data-no); position: absolute; right: -3px; bottom: -25px; color: rgba(16,17,18,.06); font: 900 128px/.8 var(--display); letter-spacing: -.08em; }
    .mission-card.claimed { background: var(--mint); }
    .mission-card.active { color: #fff; background: var(--red); box-shadow: inset 0 0 0 4px var(--acid); }
    .mission-card.active::after { color: rgba(255,255,255,.15); }
    .mission-card.locked { background: #e9e5db; }
    .mission-status { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; color: #54514a; font-size: 10px; font-weight: 900; letter-spacing: .15em; }
    .active .mission-status { color: #fffbd3; }
    .status-dot { width: 9px; height: 9px; background: currentColor; transform: rotate(45deg); }
    .mission-name { position: relative; z-index: 1; margin: 21px 0 8px; font: 900 clamp(26px, 3.2vw, 38px)/.88 var(--display); letter-spacing: -.04em; }
    .mission-detail { position: relative; z-index: 1; max-width: 205px; margin: 0; color: #534f47; font-size: 13px; font-weight: 700; line-height: 1.55; }
    .active .mission-detail { color: #ffe9e1; }
    .reward-ticket { position: relative; z-index: 1; display: flex; gap: 8px; align-items: center; margin-top: auto; padding: 9px 10px; border: 1px solid currentColor; background: rgba(255,255,255,.38); font-size: 12px; font-weight: 900; }
    .reward-ticket::before { content: "✦"; color: var(--violet); font-size: 15px; }
    .active .reward-ticket { color: var(--ink); background: var(--acid); }
    .mission-action { position: relative; z-index: 1; width: fit-content; margin-top: 11px; padding: 10px 14px; color: #fff; border: 0; background: var(--ink); font-size: 12px; font-weight: 900; transition: transform .18s ease, box-shadow .18s ease; }
    .active .mission-action { color: var(--ink); background: var(--acid); }
    .mission-action:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 rgba(16,17,18,.32); }
    .mission-action[disabled] { cursor: default; opacity: .8; }

    .atmosphere-grid { display: grid; grid-template-columns: 1.45fr .8fr; gap: 12px; margin-top: 12px; }
    .atmosphere-card, .broadcast-card { border: 1px solid var(--ink); }
    .atmosphere-card { padding: 17px; background: #fff; }
    .small-heading { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .small-heading h3 { margin: 0; font: 900 22px/.95 var(--display); letter-spacing: -.02em; }
    .skip-tag { padding: 4px 6px; border: 1px solid var(--ink); color: #5d5952; font-size: 9px; font-weight: 900; letter-spacing: .1em; }
    .small-heading + p { margin: 7px 0 13px; color: #605c54; font-size: 12px; line-height: 1.6; }
    .scene-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .scene-chip { min-height: 70px; padding: 10px; text-align: left; color: var(--ink); border: 1px solid var(--ink); background: var(--paper); transition: .18s ease; }
    .scene-chip:hover, .scene-chip.selected { color: var(--ink); background: var(--acid); box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px, -1px); }
    .scene-chip strong { display: block; font-size: 13px; }
    .scene-chip span { display: block; margin-top: 5px; font-size: 10px; font-weight: 700; opacity: .7; }
    .broadcast-card { position: relative; display: flex; flex-direction: column; padding: 17px; color: #fff; background: var(--violet); overflow: hidden; }
    .broadcast-card::after { content: "ON AIR"; position: absolute; right: -12px; bottom: -8px; color: rgba(255,255,255,.13); font: 900 55px/.8 var(--display); letter-spacing: -.05em; }
    .broadcast-card .eyebrow { color: var(--acid); }
    .broadcast-card h3 { position: relative; z-index: 1; margin: 9px 0 6px; font: 900 26px/.85 var(--display); }
    .broadcast-card p { position: relative; z-index: 1; margin: 0; color: #e5e1ff; font-size: 12px; font-weight: 700; line-height: 1.55; }
    .text-button { position: relative; z-index: 1; width: fit-content; margin-top: auto; padding: 0; color: var(--acid); border: 0; background: transparent; font-size: 12px; font-weight: 900; text-decoration: underline; text-underline-offset: 4px; }

    .gateway-zone { padding: 0 0 52px; }
    .campus-gateway { position: relative; min-height: 185px; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 20px; padding: 27px 30px; color: #fff; background: var(--ink); box-shadow: 8px 8px 0 var(--red); overflow: hidden; }
    .campus-gateway::before { content: "CAMPUS"; position: absolute; right: -7px; top: 16px; color: rgba(244,255,50,.1); font: 900 122px/.8 var(--display); letter-spacing: -.07em; }
    .gateway-copy { position: relative; z-index: 1; }
    .gateway-copy h2 { max-width: 610px; margin: 8px 0 8px; font: 900 clamp(34px, 5vw, 62px)/.82 var(--display); letter-spacing: -.055em; }
    .gateway-copy p { margin: 0; color: #c9c9c9; font-size: 12px; font-weight: 700; line-height: 1.6; }
    .gateway-action { position: relative; z-index: 1; justify-self: end; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
    .gateway-action span { color: var(--mint); font-size: 11px; font-weight: 800; }
    .primary-button { padding: 13px 17px; color: var(--ink); border: 0; background: var(--acid); box-shadow: 4px 4px 0 var(--red); font-size: 13px; font-weight: 900; transition: .18s ease; }
    .primary-button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--red); }

    .campus-zone { position: relative; padding: 45px 0 66px; background: #ebe6d9; }
    .campus-zone::before { content: "02"; position: absolute; z-index: 0; top: 28px; left: max(18px, calc((100vw - 1180px) / 2 - 50px)); color: rgba(242,56,35,.11); font: 900 160px/.8 var(--display); }
    .campus-zone .shell { position: relative; z-index: 1; }
    .identity-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .identity-card { position: relative; min-height: 210px; display: flex; flex-direction: column; padding: 19px; overflow: hidden; text-align: left; border: 1px solid var(--ink); background: #fbf9f0; transition: .2s ease; }
    .identity-card::after { content: attr(data-stamp); position: absolute; right: -10px; bottom: -8px; color: rgba(16,17,18,.06); font: 900 58px/.8 var(--display); letter-spacing: -.06em; }
    .identity-card:hover, .identity-card.selected { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--ink); }
    .identity-card.selected { color: #fff; background: var(--violet); }
    .identity-card.freshman.selected { background: var(--red); }
    .identity-card.pioneer.selected { color: var(--ink); background: var(--acid); }
    .identity-label { position: relative; z-index: 1; color: var(--red); font-size: 10px; font-weight: 900; letter-spacing: .16em; }
    .selected .identity-label { color: var(--acid); }
    .pioneer.selected .identity-label { color: var(--red); }
    .identity-card h3 { position: relative; z-index: 1; margin: 15px 0 8px; font: 900 35px/.85 var(--display); letter-spacing: -.04em; }
    .identity-card p { position: relative; z-index: 1; max-width: 230px; margin: 0; color: #5e5a51; font-size: 12px; font-weight: 700; line-height: 1.6; }
    .selected p { color: rgba(255,255,255,.87); }
    .pioneer.selected p { color: #34331d; }
    .identity-card strong { position: relative; z-index: 1; margin-top: auto; font-size: 12px; }

    .role-panel { position: relative; display: grid; grid-template-columns: 1.05fr .95fr; gap: 0; margin-top: 18px; border: 1px solid var(--ink); background: #fffdf6; box-shadow: var(--shadow); }
    .role-main { padding: 26px; }
    .role-main .eyebrow { color: var(--red); }
    .role-main h3 { margin: 10px 0 8px; font: 900 clamp(30px, 4vw, 44px)/.87 var(--display); letter-spacing: -.045em; }
    .role-main > p { max-width: 530px; margin: 0; color: #605b52; font-size: 13px; line-height: 1.65; }
    .flow-steps { display: grid; gap: 8px; margin-top: 21px; }
    .flow-step { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; min-height: 55px; padding: 10px; border: 1px solid var(--line); background: #faf8ee; }
    .step-index { display: grid; width: 26px; height: 26px; place-items: center; color: #fff; background: var(--ink); font-size: 10px; font-weight: 900; }
    .flow-step strong { display: block; font-size: 13px; }
    .flow-step span { display: block; margin-top: 3px; color: #6d685e; font-size: 11px; line-height: 1.4; }
    .step-state { padding: 5px 7px; color: var(--ink); background: var(--acid); font-size: 10px; font-weight: 900; white-space: nowrap; }
    .step-state.complete { color: #fff; background: var(--violet); }
    .step-state.pending { color: #fff; background: var(--red); }
    .flow-button { padding: 10px 13px; color: #fff; border: 0; background: var(--ink); font-size: 12px; font-weight: 900; }
    .role-side { position: relative; min-height: 100%; padding: 25px; color: #fff; background: var(--ink); overflow: hidden; }
    .role-side::before { content: "SZU"; position: absolute; right: -15px; bottom: -22px; color: rgba(244,255,50,.1); font: 900 135px/.75 var(--display); letter-spacing: -.09em; }
    .role-side > * { position: relative; z-index: 1; }
    .school-mark { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--acid); font-size: 10px; font-weight: 900; letter-spacing: .15em; }
    .school-mark::after { content: "深圳 · SZ"; padding: 5px 6px; color: var(--ink); background: var(--mint); font-size: 9px; letter-spacing: .07em; }
    .role-side h4 { margin: 18px 0 8px; font: 900 34px/.85 var(--display); letter-spacing: -.035em; }
    .role-side p { margin: 0; color: #d0d0d0; font-size: 12px; font-weight: 700; line-height: 1.65; }
    .side-ticket { margin-top: 20px; padding: 11px; border: 1px solid var(--acid); color: var(--acid); font-size: 12px; font-weight: 900; }
    .side-ticket b { display: block; margin-bottom: 4px; color: #fff; font-size: 11px; }

    .campus-secondary { display: grid; grid-template-columns: 1.1fr .9fr; gap: 12px; margin-top: 18px; }
    .stall-feed, .cup-entry { border: 1px solid var(--ink); background: #fffdf6; }
    .stall-feed { padding: 20px; }
    .feed-title { display: flex; justify-content: space-between; gap: 15px; align-items: end; }
    .feed-title h3, .cup-entry h3 { margin: 7px 0 0; font: 900 28px/.88 var(--display); letter-spacing: -.035em; }
    .feed-title button { padding: 7px 10px; color: #fff; border: 0; background: var(--ink); font-size: 11px; font-weight: 900; }
    .stall-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-top: 12px; padding: 12px 0 0; border-top: 1px solid var(--line); }
    .stall-item strong { display: block; font-size: 13px; }
    .stall-item span { display: block; margin-top: 3px; color: #686358; font-size: 11px; }
    .stall-status { padding: 5px 7px; color: var(--ink); background: var(--mint); font-size: 10px; font-weight: 900; }
    .cup-entry { position: relative; padding: 20px; color: #fff; background: var(--red); overflow: hidden; }
    .cup-entry::after { content: "CUP"; position: absolute; right: -8px; bottom: -18px; color: rgba(255,255,255,.15); font: 900 110px/.8 var(--display); letter-spacing: -.08em; }
    .cup-entry .eyebrow { color: var(--acid); }
    .cup-entry h3, .cup-entry p, .cup-entry a { position: relative; z-index: 1; }
    .cup-entry p { margin: 10px 0 19px; color: #ffe1d9; font-size: 12px; font-weight: 700; line-height: 1.55; }
    .cup-entry a { color: var(--ink); font-size: 12px; font-weight: 900; text-decoration: underline; text-underline-offset: 4px; }

    .footer { padding: 21px 0 30px; color: #727066; font-size: 10px; font-weight: 700; letter-spacing: .06em; }
    .footer-inner { display: flex; justify-content: space-between; gap: 15px; border-top: 1px solid var(--line); padding-top: 15px; }

    .toast { position: fixed; z-index: 20; left: 50%; bottom: 25px; padding: 11px 14px; color: #fff; background: var(--ink); box-shadow: 5px 5px 0 var(--red); font-size: 12px; font-weight: 800; opacity: 0; transform: translate(-50%, 24px); pointer-events: none; transition: .25s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .modal-overlay { position: fixed; z-index: 30; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(16,17,18,.72); }
    .modal { position: relative; width: min(420px, 100%); padding: 26px; color: var(--ink); border: 1px solid var(--ink); background: var(--acid); box-shadow: 9px 9px 0 var(--red); }
    .modal-close { position: absolute; right: 10px; top: 8px; color: var(--ink); border: 0; background: transparent; font-size: 24px; font-weight: 900; }
    .share-card { min-height: 255px; display: flex; flex-direction: column; justify-content: end; padding: 20px; color: #fff; background: var(--violet); border: 1px solid var(--ink); box-shadow: inset 0 0 0 7px var(--mint); }
    .share-card small { color: var(--acid); font-size: 10px; font-weight: 900; letter-spacing: .16em; }
    .share-card strong { margin: 10px 0 6px; font: 900 45px/.83 var(--display); letter-spacing: -.05em; }
    .share-card span { font-size: 12px; font-weight: 800; }
    .modal-copy h3 { margin: 0 0 9px; font: 900 35px/.86 var(--display); letter-spacing: -.04em; }
    .modal-copy p { margin: 0; font-size: 13px; font-weight: 700; line-height: 1.65; }

    @media (max-width: 820px) {
      .shell { width: min(100% - 28px, 1180px); }
      .campaign-strip { height: 132px; }
      .strip-sticker { width: 72px; height: 72px; font-size: 12px; right: 3px; }
      .section-header { display: block; }
      .section-copy { margin-top: 10px; }
      .mission-grid, .atmosphere-grid, .identity-grid, .role-panel, .campus-secondary, .campus-gateway { grid-template-columns: 1fr; }
      .board-banner { grid-template-columns: 1fr; }
      .board-meta { justify-content: flex-start; }
      .progress-line { max-width: 190px; }
      .mission-card { min-height: 213px; }
      .gateway-action { justify-self: start; }
      .role-side { min-height: 220px; }
    }

    @media (max-width: 540px) {
      .top-nav span:nth-child(2) { display: none; }
      .topbar { height: 45px; }
      .campaign-strip { height: 118px; }
      .strip-title { max-width: 240px; }
      .strip-note { font-size: 9px; }
      .strip-sticker { top: 20px; right: 1px; width: 61px; height: 61px; box-shadow: 3px 3px 0 var(--ink); font-size: 10px; }
      .mission-zone, .campus-zone { padding-top: 31px; }
      .mission-content, .role-main, .role-side, .campus-gateway, .atmosphere-card, .broadcast-card, .stall-feed, .cup-entry { padding: 16px; }
      .board-banner { min-height: 101px; padding: 18px 16px; }
      .section-title { font-size: 36px; }
      .small-heading { align-items: start; flex-direction: column; }
      .scene-list { grid-template-columns: 1fr; }
      .flow-step { grid-template-columns: 28px 1fr; }
      .flow-button, .step-state { grid-column: 2; justify-self: start; }
      .footer-inner { display: block; line-height: 1.8; }
    }

    /* Refined editorial layer: calm campus print base, controlled signal colors. */
    body { background-color: var(--paper); background-image: radial-gradient(rgba(28,36,32,.055) .65px, transparent .65px); background-size: 7px 7px; }
    .page { background: linear-gradient(180deg, rgba(255,255,255,.42), transparent 32rem); }
    .section-title, .strip-title, .board-banner h2, .mission-name, .gateway-copy h2, .identity-card h3, .role-main h3, .role-side h4, .feed-title h3, .cup-entry h3 { text-wrap: balance; }
    .section-title { font-weight: 850; letter-spacing: -.075em; }
    .topbar { border-bottom: 1px solid rgba(215,223,83,.52); background: #1b241f; }
    .brand-mark { background: var(--acid); border-radius: 3px; transform: rotate(-4deg); }
    .campaign-strip { height: 142px; border-bottom: 0; background: #d9e057; }
    .campaign-strip::before { background: radial-gradient(circle at 75% 35%, rgba(255,255,255,.62) 0 8%, transparent 8.25%), linear-gradient(111deg, transparent 0 22%, rgba(28,36,32,.11) 22.2% 25%, transparent 25.2% 56%, rgba(207,97,75,.52) 56.2% 60%, transparent 60.2%); opacity: 1; }

function renderQbRewardPanel() {
  const veteran = state.veteran;
  const completed = completedInviteCount();
  const delivery = veteran.loginChannel === 'qq'
    ? '当前为 QQ 登录：抽中的 QB 将直接发放至当前 QQ 账号。'
    : '当前为微信登录：抽奖前需填写用于接收 QB 的 QQ 号。';
  const cards = veteran.qbRewards.map((reward) => {
    const available = completed >= reward.threshold;
    const status = reward.drawn ? 'claimed' : available ? 'available' : 'locked';
    const action = reward.drawn
      ? `<button disabled>已抽中 ${reward.amount} QB</button>`
      : available
        ? `<button data-action="draw-qb" data-id="${reward.id}">进行 QB 抽奖 →</button>`
        : `<button disabled>还差 ${reward.threshold - completed} 名完成开黑</button>`;
    return `<article class="qb-reward-card ${status}"><small>${reward.quota} 份抽奖机会</small><h5>与 ${reward.threshold} 名新生开黑</h5><p>每名新生完成 1 局普通 / 竞技模式后计入进度。</p><strong>随机 ${reward.range}</strong>${action}</article>`;
  }).join('');
  return `<section class="qb-reward-panel"><div class="qb-reward-head"><div><span class="workspace-kicker">QB MILESTONE DRAW</span><h4>开黑里程碑 QB 抽奖</h4></div><p>分别与 1 / 3 / 5 名受邀新生完成 1 局开黑，即可各获得 1 次抽奖机会。</p></div><div class="qb-progress">已完成开黑：<b>${completed} / 5</b> 名新生</div><div class="qb-reward-grid">${cards}</div><div class="qb-delivery-note"><b>发放说明：</b>${delivery}</div></section>`;
}

function renderInviteSlot(slot, index) {

  const steps = [
    ['cert', '01', '高校认证', '复用学信网高校认证', veteran.certified ? 'done' : 'pending'],

function showToast(message) {
  const toast = document.querySelector('#toast');
  toast.textContent = message;
  toast.classList.add('show');
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2600);
}

function openModal(content) {
  document.querySelector('#modal-root').innerHTML = `<div class="modal-overlay" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="活动提示" onclick="event.stopPropagation()"><button class="modal-close" data-action="close-modal" aria-label="关闭弹窗">×</button>${content}</div></div>`;
}

function closeModal() { document.querySelector('#modal-root').innerHTML = ''; }

function completeMission(id) {
  const mission = state.missions.find((item) => item.id === id);
  if (!mission || mission.status === 'claimed') return;
  if (mission.status === 'locked') return showToast('完成当前任务后，即可解锁这一档返场资格。');
  mission.status = 'claimed';
  const next = state.missions.find((item) => item.status === 'locked');
  if (next) next.status = 'active';
  render();
  showToast(next ? `「${mission.title}」已完成，下一档任务已解锁。` : '返校任务已全部完成，奖励资格已登记。');
}

function drawFortune() {
  let next = fortunes[Math.floor(Math.random() * fortunes.length)];
  if (state.fortune && fortunes.length > 1) {
    while (next.title === state.fortune.title) next = fortunes[Math.floor(Math.random() * fortunes.length)];
  }
  state.fortune = next;
  render();
  showToast(`求到「${next.tag} · ${next.title}」，新学期好彩头！`);
}

function updateSchoolQuery(value) {
  state.freshman.schoolQuery = value;
  const results = document.querySelector('#school-results');
  if (results) results.innerHTML = renderSchoolResults();
}

function escapeHTML(value) {
  return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
}

function pickSchool(id) {
  const school = schools.find((item) => item.id === id);
  if (!school) return;
  state.freshman.schoolDraft = school;
  render();
}

function clearSchoolDraft() {
  state.freshman.schoolDraft = null;
  render();
}

function confirmSchool() {
  const school = state.freshman.schoolDraft;
  if (!school) return showToast('请先从搜索结果中选择学校。');
  state.freshman.school = school;
  state.freshman.schoolDraft = null;
  state.freshman.privilegeActive = true;
  state.freshman.view = 'connect';
  render();
  showToast(`${school.name} 已确认并锁定，新生体验特权已激活。`);
}

function bindFromInviteLink() {
  const veteran = state.veteran;
  if (!state.freshman.newcomerVerified || !state.freshman.school) {
    showToast('请先完成新生实名匹配并确认所属学校。');
    return;
  }
  if (!veteran.certified || !veteran.profileComplete) {
    showToast('演示流程：请先在“我是老生”完成认证、个人资料和邀请位步骤。');
    return;
  }
  const openIndex = veteran.invites.findIndex((item) => !item);
  if (openIndex < 0) return showToast('该老生的 5 个邀请位均已绑定。');
  const school = state.freshman.school;
  const student = { name: '林乔', school: school.name, gameCompleted: false };
  veteran.invites[openIndex] = student;
  veteran.activeInvite = openIndex;
  state.freshman.mentor = { name: '云野', gameId: 'Yunye#SZU', inviteIndex: openIndex };
  state.freshman.identityVerified = true;
  render();
  showToast(`邀请链接验证成功：${school.name}认证老生已完成身份确认，礼包领取已解锁。`);
}

function verifyNewcomerId(form) {
  const realName = form.elements.realName.value.trim();
  const idCard = form.elements.idCard.value.trim().toUpperCase();
  if (!/^[\u4e00-\u9fa5·]{2,30}$/.test(realName)) {
    showToast('请输入与账号实名一致的真实姓名。');
    return;
  }
  if (!/^\d{17}[\dX]$/.test(idCard)) {
    showToast('请输入有效的 18 位身份证号后再提交。');
    return;
  }
  form.reset();
  state.freshman.newcomerVerified = true;
  state.freshman.view = 'school';
  render();
  showToast('账号实名匹配已通过，真实姓名与身份证号均未记录或存储。');
}

function joinGroup() {
  state.freshman.groupJoined = true;
  showToast('群二维码已打开演示入口；请在真实流程中扫码加入本校瓦友群。');
}

function toggleInviteDebug() {
  state.freshman.debugInvitePreview = !state.freshman.debugInvitePreview;
  render();
  showToast(state.freshman.debugInvitePreview ? '已切换为邀请成功调试态。' : '已返回邀请前调试态。');
}

function toggleVeteranCertificationPreview() {
  state.veteran.certified = !state.veteran.certified;
  state.veteran.view = 'cert';
  state.identity = 'veteran';
  render();
  showToast(state.veteran.certified ? '已切换为老生已认证预览态。' : '已切换为老生未认证预览态。');
}

function toggleLoginChannelPreview() {
  state.veteran.loginChannel = state.veteran.loginChannel === 'qq' ? 'wechat' : 'qq';
  render();
  showToast(`已切换为 ${state.veteran.loginChannel === 'qq' ? 'QQ' : '微信'}登录预览态。`);
}

function seedQbMilestonePreview() {
  const names = ['林乔', '许闻', '陈星', '周野', '沈遥'];
  state.veteran.invites = names.map((name, index) => ({ name, school: '深圳大学', gameCompleted: true, inviteIndex: index }));
  state.veteran.certified = true;
  state.veteran.profileComplete = true;
  state.veteran.view = 'invites';
  state.identity = 'veteran';
  render();
  showToast('已生成 5 名新生完成开黑的内部预览态。');
}

function togglePioneerWhitelistPreview() {
  state.pioneer.eligible = !state.pioneer.eligible;
  state.identity = 'pioneer';
  render();
  showToast(state.pioneer.eligible ? '已切换为先锋白名单内预览态（跳问卷 A）。' : '已切换为非白名单预览态（跳问卷 B）。');
}

function continueVeteran() {
  if (!state.veteran.certified) return verifyVeteran();
  state.veteran.view = 'profile';
  render();
  showToast('已沿用高校认证身份，请继续完成资料与小程序绑定。');
}

function bindMiniProgram() {
  state.veteran.miniProgramBound = true;
  render();
  showToast('已完成小程序绑定，并加入深圳大学瓦友群。');
}

function completeInviteGame(index) {
  const student = state.veteran.invites[Number(index)];
  if (!student || student.gameCompleted) return;
  student.gameCompleted = true;
  render();
  showToast(`已登记与 ${student.name} 的 1 局开黑，QB 抽奖资格将按完成新生数解锁。`);
}

function getQbReward(id) {
  return state.veteran.qbRewards.find((reward) => reward.id === id);
}

function qbAmountFor(reward) {
  const roll = Math.random() * 100;
  if (reward.threshold === 1) return roll < 93 ? 2 : roll < 99 ? 3 : 5;
  if (reward.threshold === 3) return roll < 82 ? 2 : roll < 97 ? 5 : 10;
  return roll < 70 ? 2 : roll < 95 ? 10 : 20;
}

function openQbDraw(id) {
  const reward = getQbReward(id);
  if (!reward || reward.drawn) return;
  if (completedInviteCount() < reward.threshold) {
    showToast(`还需完成 ${reward.threshold - completedInviteCount()} 名新生的开黑任务。`);
    return;
  }
  const title = `与 ${reward.threshold} 名新生开黑 · QB 抽奖`;
  const delivery = state.veteran.loginChannel === 'qq'
    ? `<p>当前为 QQ 登录，抽中的 QB 将直接发放至当前 QQ 账号。</p><button class="modal-cta" data-action="confirm-qb-draw" data-id="${reward.id}">确认抽奖 →</button>`
    : `<form id="qb-receiver-form" class="modal-copy qb-draw-form" data-reward-id="${reward.id}"><p>当前为微信登录。请填写用于接收 QB 的 QQ 号，号码仅用于本次奖励发放。</p><label>接收 QB 的 QQ 号<input name="receiverQQ" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="请输入 QQ 号" required></label><button class="modal-cta" type="submit">确认并抽奖 →</button></form>`;
  openModal(`<div class="modal-copy"><h3>${title}</h3><p>本档随机获得 ${reward.range}，共 ${reward.quota} 份抽奖机会，发完即止。</p>${delivery}</div>`);
}

function confirmQbDraw(id) {
  const reward = getQbReward(id);
  if (!reward || reward.drawn) return;
  reward.amount = qbAmountFor(reward);
  reward.drawn = true;
  closeModal();
  render();
  showToast(`恭喜抽中 ${reward.amount} QB，奖励已进入发放流程。`);
}

function saveQbReceiver(form) {
  const receiverQQ = form.elements.receiverQQ.value.trim();
  if (!/^[1-9]\d{4,11}$/.test(receiverQQ)) {
    showToast('请输入有效的 QQ 号。');
    return;
  }
  const id = form.dataset.rewardId;
  form.reset();
  confirmQbDraw(id);
}

function toggleContactVisibility() {
  const veteran = state.veteran;
  if (!veteran.profileSaved) {
    showToast('请先在第二步填写手机号或微信号，再开启展示。');
    return;
  }
  veteran.contactVisible = !veteran.contactVisible;
  render();
  showToast(veteran.contactVisible ? '联系方式已对已绑定新生展示。' : '联系方式展示已关闭，已绑定新生将不再看到。');
}

function verifyVeteran() {
  state.veteran.certified = true;
  state.veteran.view = 'profile';
  render();
  showToast('已复用学信网高校认证：深圳大学。');
}

function saveProfile(skip = false) {
  const phoneInput = document.querySelector('#veteran-phone');
  const wechatInput = document.querySelector('#veteran-wechat');
  state.veteran.phone = skip ? '' : (phoneInput?.value.trim() || '');
  state.veteran.wechat = skip ? '' : (wechatInput?.value.trim() || '');
  state.veteran.profileSaved = Boolean(state.veteran.phone || state.veteran.wechat);
  state.veteran.profileComplete = true;
  state.veteran.view = 'invites';
  render();
  showToast(state.veteran.profileSaved ? '个人资料已保存，绑定的新生可见已填写的联系方式。' : '已跳过个人资料，邀请链接已生成。');
}

function copyInvite(index) {
  const link = `https://wayoushe.woa.com/campus-assembly.html?invite=SZU-${String(Number(index) + 1).padStart(2, '0')}`;
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(link).catch(() => {});
  showToast(`邀请链接 ${String(Number(index) + 1).padStart(2, '0')} 已复制，可独立发送给 1 名新生。`);
}

function showInviteQr(index) {
  openModal(`<div class="invite-qr-modal"><span class="workspace-kicker">INVITE ${String(Number(index) + 1).padStart(2, '0')}</span><h3>新生邀请二维码</h3><p>新生扫码后需完成账号实名匹配、确认学校，并通过本链接重新访问页面才会绑定成功。</p>${renderQr('新生邀请二维码')}</div>`);
}

function gotoStallSurvey() {
  const eligible = state.pioneer.eligible;
  const url = eligible ? STALL_SURVEY_URL_PIONEER : STALL_SURVEY_URL_GENERAL;
  window.open(url, '_blank', 'noopener');
  showToast(eligible ? '白名单校验通过，正在打开先锋摆摊申请问卷…' : '正在打开摆摊意向登记问卷…');
}
function openGiftAddressForm() {
  const freshman = state.freshman;
  if (!getFreshmanConnection().identityVerified) {
    showToast('完成本校学长身份认证后，才可领取限量开学大礼包。');
    return;
  }
  if (!freshman.giftClaimed && state.giftStock.remaining <= 0) {
    showToast('礼包已全部领完，感谢参与。');
    return;
  }
  const address = freshman.giftAddress || {};
  const stockNote = freshman.giftClaimed
    ? '你已锁定 1 份礼包库存，可随时修改收件地址，发货前以最后一次保存为准。'
    : `当前剩余 ${state.giftStock.remaining.toLocaleString()} / ${state.giftStock.total.toLocaleString()} 份。提交即锁定 1 份库存，领取后不可取消，但可随时修改地址。`;
  openModal(`<form id="gift-address-form" class="modal-copy address-form"><h3>${address.fullAddress ? '修改收件地址' : '领取开学大礼包'}</h3><p>礼包限量发放，请填写可稳定收件的地址。信息仅用于本次礼包寄送。</p><div class="address-row"><label>收件人<input name="recipient" maxlength="30" value="${escapeHTML(address.recipient || '')}" required></label><label>手机号码<input name="phone" inputmode="tel" pattern="[0-9+ -]{6,20}" maxlength="20" value="${escapeHTML(address.phone || '')}" required></label></div><label>详细收件地址<textarea name="fullAddress" maxlength="160" placeholder="省 / 市 / 区 / 街道 / 门牌号" required>${escapeHTML(address.fullAddress || '')}</textarea></label><p class="address-tip">${stockNote}</p><button class="modal-cta" type="submit">${address.fullAddress ? '保存修改' : '确认领取并保存地址'} →</button></form>`);
}

function saveGiftAddress(form) {
  const recipient = form.elements.recipient.value.trim();
  const phone = form.elements.phone.value.trim();
  const fullAddress = form.elements.fullAddress.value.trim();
  if (!recipient || !phone || !fullAddress) return;
  const firstClaim = !state.freshman.giftClaimed;
  if (firstClaim) {
    state.giftStock.remaining = Math.max(0, state.giftStock.remaining - 1);
    state.freshman.giftClaimed = true;
  }
  state.freshman.giftAddress = { recipient, phone, fullAddress };
  closeModal();
  render();
  showToast(firstClaim ? '领取成功，已锁定 1 份礼包库存，可随时返回修改地址。' : '收件地址已更新，可随时返回修改编辑。');
}

function handleFormSubmit(event) {
  if (event.target.id === 'newcomer-verify-form') {
    event.preventDefault();
    verifyNewcomerId(event.target);
  }
  if (event.target.id === 'gift-address-form') {
    event.preventDefault();
    saveGiftAddress(event.target);
  }
  if (event.target.id === 'qb-receiver-form') {
    event.preventDefault();
    saveQbReceiver(event.target);
  }
}
function showStallRules() { openModal(`<div class="modal-copy"><h3>校园摆摊规则</h3><p>仅高校先锋可申请。先提交意向，官方入围或联络后再补充场地、人员、物料、玩法与风险预案。确认活动优先展示给本校玩家，本校暂无时展示同城活动。</p></div>`); }
function showCupRules() { openModal(`<div class="modal-copy"><h3>新生杯</h3><p>个人随机组队，以所属学校出战。新生拥有独立新生榜与核心奖励；老生可参赛但不参与新生榜。详细赛制将在独立赛事规则页公布。</p></div>`); }

function handleAction(event) {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const { action, id } = target.dataset;
  if (action === 'mission') completeMission(id);
  if (action === 'draw-fortune') drawFortune();
  if (action === 'goto-campus') document.querySelector('#campus-zone').scrollIntoView({ behavior: 'smooth' });
  if (action === 'identity') { state.identity = id; render(); window.setTimeout(() => document.querySelector('.workspace-panel, .pioneer-panel')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 0); }
  if (action === 'freshman-view') {
    if (id !== 'age' && !state.freshman.newcomerVerified) {
      showToast('请先输入身份证号完成账号实名匹配。');
      return;
    }
    state.freshman.view = id;
    render();
  }
  if (action === 'veteran-view') { state.veteran.view = id; render(); }
  if (action === 'pick-school') pickSchool(id);
  if (action === 'confirm-school') confirmSchool();
  if (action === 'clear-school-draft') clearSchoolDraft();
  if (action === 'join-group') joinGroup();
  if (action === 'simulate-invite') bindFromInviteLink();
  if (action === 'toggle-invite-debug') toggleInviteDebug();
  if (action === 'toggle-login-channel-preview') toggleLoginChannelPreview();
  if (action === 'seed-qb-milestone-preview') seedQbMilestonePreview();
  if (action === 'complete-invite-game') completeInviteGame(id);
  if (action === 'draw-qb') openQbDraw(id);
  if (action === 'confirm-qb-draw') confirmQbDraw(id);
  if (action === 'claim-gift' || action === 'edit-gift-address') openGiftAddressForm();
  if (action === 'verify-veteran') verifyVeteran();
  if (action === 'continue-veteran') continueVeteran();
  if (action === 'toggle-veteran-certification-preview') toggleVeteranCertificationPreview();
  if (action === 'bind-mini-program') bindMiniProgram();
  if (action === 'toggle-contact-visibility') toggleContactVisibility();
  if (action === 'save-profile') saveProfile(false);
  if (action === 'skip-profile') saveProfile(true);
  if (action === 'copy-invite') copyInvite(id);
  if (action === 'show-invite-qr') showInviteQr(id);
  if (action === 'goto-stall-survey') gotoStallSurvey();
  if (action === 'show-stall-details') showStallRules();
  if (action === 'toggle-pioneer-whitelist-preview') togglePioneerWhitelistPreview();
  if (action === 'cup-rules') showCupRules();
  if (action === 'close-modal') closeModal();
}

document.addEventListener('click', handleAction);
document.addEventListener('submit', handleFormSubmit);

// 自注入新增结构所需的样式（信号台 / 弹窗 CTA），使其不依赖宿主页 <style>
(function injectCampusStyles() {
  if (document.getElementById('campus-extra-styles')) return;
  const el = document.createElement('style');
  el.id = 'campus-extra-styles';
  el.textContent = `
    .modal-cta { display: inline-block; margin-top: 14px; padding: 12px 16px; color: #cbd96a; background: #1b1e1c; border: 0; font-size: 13px; font-weight: 900; letter-spacing: .02em; }
    .modal-cta:hover { background: #2b302d; }
  `;
  document.head.appendChild(el);
})();

render();

</script>
</body>
</html>
