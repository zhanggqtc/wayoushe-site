const CACHE_KEY = "wayoushe_spring_2027_pwd";
const form = document.querySelector("#form"), input = document.querySelector("#password"), status = document.querySelector("#status");
const bytesFromBase64 = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
async function unlock(password){
  const raw = bytesFromBase64(PAYLOAD);
  const salt = raw.slice(0, 16);
  const iv = raw.slice(16, 28);
  const data = raw.slice(28);
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
  sessionStorage.setItem(CACHE_KEY, password);
  document.open();
  document.write(new TextDecoder().decode(plain));
  document.close();
}
form.addEventListener("submit", async event => {
  event.preventDefault();
  status.textContent = "正在验证…";
  try { await unlock(input.value) } catch (error) {
    sessionStorage.removeItem(CACHE_KEY);
    status.textContent = "密码不正确，请重新输入。";
    input.select();
  }
});
const direct = new URLSearchParams(location.hash.slice(1)).get("access");
const cached = direct || sessionStorage.getItem(CACHE_KEY);
if (cached) { unlock(cached).catch(() => { if (!direct) sessionStorage.removeItem(CACHE_KEY) }); }
